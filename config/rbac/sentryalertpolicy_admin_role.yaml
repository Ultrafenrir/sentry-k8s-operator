apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sentryalertpolicy-admin-role
  labels:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/managed-by: kustomize
rules:
  - apiGroups: [sentryconfiguration.io]
    resources: [sentryalertpolicies]
    verbs: ['*']
  - apiGroups: [sentryconfiguration.io]
    resources: [sentryalertpolicies/status]
    verbs: [get]
