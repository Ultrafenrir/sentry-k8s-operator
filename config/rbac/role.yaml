---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - sentryconfiguration.io
  resources:
  - sentryalertpolicies
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sentryconfiguration.io
  resources:
  - sentryalertpolicies/status
  - sentryconnections/status
  - sentryprojects/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - sentryconfiguration.io
  resources:
  - sentryconnections
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sentryconfiguration.io
  resources:
  - sentryprojects
  verbs:
  - get
  - list
  - patch
  - watch
