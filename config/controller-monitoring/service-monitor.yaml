apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sentry-kubernetes-operator-controller
  namespace: sentry-kubernetes-operator-system
  labels:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/component: controller-manager
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: sentry-kubernetes-operator
  namespaceSelector:
    matchNames:
    - sentry-kubernetes-operator-system
  endpoints:
  - port: https
    path: /metrics
    scheme: https
    interval: 30s
    scrapeTimeout: 10s
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    tlsConfig:
      serverName: sentry-kubernetes-operator-controller-manager-metrics-service.sentry-kubernetes-operator-system.svc.cluster.local
      insecureSkipVerify: false
      ca:
        secret:
          name: metrics-server-cert
          key: ca.crt
