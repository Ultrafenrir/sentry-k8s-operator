apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sentry-kubernetes-operator-controller
  namespace: sentry-kubernetes-operator-system
  labels:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/component: controller-manager
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: sentry-kubernetes-operator
  namespaceSelector:
    matchNames:
    - sentry-kubernetes-operator-system
  endpoints:
  - port: http
    path: /metrics
    scheme: http
    interval: 30s
    scrapeTimeout: 10s
