apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registration-writer-ingress
  namespace: sentry-kubernetes-operator-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentry-kubernetes-operator
      app.kubernetes.io/component: registration-writer
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - port: 8444
      protocol: TCP
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: sentry-kubernetes-operator
          app.kubernetes.io/component: telegram-receiver
    ports:
    - port: 8445
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: telegram-receiver
  namespace: sentry-kubernetes-operator-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentry-kubernetes-operator
      app.kubernetes.io/component: telegram-receiver
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - port: 8443
      protocol: TCP
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: sentry-kubernetes-operator
          app.kubernetes.io/component: registration-writer
    ports:
    - port: 8445
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
