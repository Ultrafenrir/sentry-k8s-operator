apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentry-hook-receiver
  namespace: sentry-kubernetes-operator-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentry-kubernetes-operator
      app.kubernetes.io/component: sentry-hook-receiver
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - port: 8446
      protocol: TCP
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: sentry-kubernetes-operator
          app.kubernetes.io/component: sentry-hook-producer
    ports:
    - port: 8447
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
