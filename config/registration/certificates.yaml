apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: registration-selfsigned
  namespace: sentry-kubernetes-operator-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: registration-ca
  namespace: sentry-kubernetes-operator-system
spec:
  isCA: true
  commonName: sentry-kubernetes-operator-registration-ca
  secretName: registration-ca
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    kind: Issuer
    name: registration-selfsigned
  usages:
  - cert sign
  - crl sign
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: registration-ca
  namespace: sentry-kubernetes-operator-system
spec:
  ca:
    secretName: registration-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: registration-writer-server
  namespace: sentry-kubernetes-operator-system
spec:
  secretName: registration-writer-server-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    kind: Issuer
    name: registration-ca
  dnsNames:
  - registration-writer-challenge.sentry-kubernetes-operator-system.svc
  - registration-writer-challenge.sentry-kubernetes-operator-system.svc.cluster.local
  - registration-writer-internal.sentry-kubernetes-operator-system.svc
  - registration-writer-internal.sentry-kubernetes-operator-system.svc.cluster.local
  usages:
  - server auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: telegram-receiver-client
  namespace: sentry-kubernetes-operator-system
spec:
  secretName: telegram-receiver-client-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    kind: Issuer
    name: registration-ca
  uris:
  - spiffe://cluster.local/ns/sentry-kubernetes-operator-system/sa/telegram-receiver
  usages:
  - client auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sentry-hook-producer-server
  namespace: sentry-kubernetes-operator-system
spec:
  secretName: sentry-hook-producer-server-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    kind: Issuer
    name: registration-ca
  dnsNames:
  - sentry-hook-producer.sentry-kubernetes-operator-system.svc
  - sentry-hook-producer.sentry-kubernetes-operator-system.svc.cluster.local
  usages:
  - server auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sentry-hook-receiver-client
  namespace: sentry-kubernetes-operator-system
spec:
  secretName: sentry-hook-receiver-client-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    kind: Issuer
    name: registration-ca
  uris:
  - spiffe://cluster.local/ns/sentry-kubernetes-operator-system/sa/sentry-hook-receiver
  usages:
  - client auth
