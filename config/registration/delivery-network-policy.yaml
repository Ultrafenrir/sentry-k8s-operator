apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: telegram-delivery-worker
  namespace: sentry-kubernetes-operator-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentry-kubernetes-operator
      app.kubernetes.io/component: telegram-delivery-worker
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - port: 8081
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          metrics: enabled
    ports:
    - port: 8080
      protocol: TCP
  egress:
  - ports:
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
