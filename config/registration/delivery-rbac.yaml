apiVersion: v1
kind: ServiceAccount
metadata:
  name: telegram-delivery-worker
  namespace: sentry-kubernetes-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: telegram-delivery-worker-routing
  namespace: sentry-kubernetes-operator-routing
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: telegram-delivery-worker-routing
  namespace: sentry-kubernetes-operator-routing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: telegram-delivery-worker-routing
subjects:
- kind: ServiceAccount
  name: telegram-delivery-worker
  namespace: sentry-kubernetes-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: telegram-delivery-worker-queue
  namespace: sentry-kubernetes-operator-delivery
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - update
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: telegram-delivery-worker-queue
  namespace: sentry-kubernetes-operator-delivery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: telegram-delivery-worker-queue
subjects:
- kind: ServiceAccount
  name: telegram-delivery-worker
  namespace: sentry-kubernetes-operator-system
