apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-delivery-worker
  namespace: sentry-kubernetes-operator-system
  labels:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/component: telegram-delivery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sentry-kubernetes-operator
      app.kubernetes.io/component: telegram-delivery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentry-kubernetes-operator
        app.kubernetes.io/component: telegram-delivery-worker
    spec:
      serviceAccountName: telegram-delivery-worker
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: controller:latest
        imagePullPolicy: IfNotPresent
        command:
        - /telegram-delivery-worker
        args:
        - --health-address=:8081
        - --metrics-address=:8080
        - --bot-token-file=/var/run/telegram/bot-auth/token
        - --routing-namespace=sentry-kubernetes-operator-routing
        - --delivery-namespace=sentry-kubernetes-operator-delivery
        - --audit-namespace=sentry-kubernetes-operator-audit
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
            scheme: HTTP
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
        - name: bot-auth
          mountPath: /var/run/telegram/bot-auth
          readOnly: true
      volumes:
      - name: bot-auth
        secret:
          secretName: telegram-bot-auth
          items:
          - key: token
            path: token
---
apiVersion: v1
kind: Service
metadata:
  name: telegram-delivery-worker-metrics
  namespace: sentry-kubernetes-operator-system
  labels:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/component: telegram-delivery-worker
spec:
  selector:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/component: telegram-delivery-worker
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
    protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: telegram-delivery-worker
  namespace: sentry-kubernetes-operator-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentry-kubernetes-operator
      app.kubernetes.io/component: telegram-delivery-worker
