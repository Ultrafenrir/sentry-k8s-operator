apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentry-hook-producer
  namespace: sentry-kubernetes-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentry-hook-producer-sources
  namespace: sentry-kubernetes-operator-hook-sources
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentry-hook-producer-sources
  namespace: sentry-kubernetes-operator-hook-sources
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentry-hook-producer-sources
subjects:
- kind: ServiceAccount
  name: sentry-hook-producer
  namespace: sentry-kubernetes-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentry-hook-producer-queue
  namespace: sentry-kubernetes-operator-delivery
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - create
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentry-hook-producer-queue
  namespace: sentry-kubernetes-operator-delivery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentry-hook-producer-queue
subjects:
- kind: ServiceAccount
  name: sentry-hook-producer
  namespace: sentry-kubernetes-operator-system
