apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentry-hook-receiver
  namespace: sentry-kubernetes-operator-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentry-hook-receiver
  namespace: sentry-kubernetes-operator-system
  labels:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/component: sentry-hook-receiver
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sentry-kubernetes-operator
      app.kubernetes.io/component: sentry-hook-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentry-kubernetes-operator
        app.kubernetes.io/component: sentry-hook-receiver
    spec:
      serviceAccountName: sentry-hook-receiver
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: receiver
        image: controller:latest
        imagePullPolicy: IfNotPresent
        command:
        - /sentry-hook-receiver
        args:
        - --address=:8446
        - --tls-cert-file=/var/run/sentry-hook/server/tls.crt
        - --tls-key-file=/var/run/sentry-hook/server/tls.key
        - --sources-dir=/var/run/sentry-hook/sources
        - --producer-url=https://sentry-hook-producer.sentry-kubernetes-operator-system.svc:8447/internal/v1/sentry-hooks/deliveries
        - --producer-ca-file=/var/run/sentry-hook/ca/tls.crt
        - --producer-cert-file=/var/run/sentry-hook/client/tls.crt
        - --producer-key-file=/var/run/sentry-hook/client/tls.key
        ports:
        - name: webhook
          containerPort: 8446
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: webhook
            scheme: HTTPS
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: webhook
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 250m
            memory: 96Mi
        volumeMounts:
        - name: server-tls
          mountPath: /var/run/sentry-hook/server
          readOnly: true
        - name: sources
          mountPath: /var/run/sentry-hook/sources
          readOnly: true
        - name: producer-client
          mountPath: /var/run/sentry-hook/client
          readOnly: true
        - name: producer-ca
          mountPath: /var/run/sentry-hook/ca
          readOnly: true
      volumes:
      - name: server-tls
        secret:
          secretName: sentry-hook-receiver-tls
      - name: sources
        secret:
          secretName: sentry-hook-receiver-sources
      - name: producer-client
        secret:
          secretName: sentry-hook-receiver-client-tls
      - name: producer-ca
        secret:
          secretName: registration-ca
          items:
          - key: tls.crt
            path: tls.crt
---
apiVersion: v1
kind: Service
metadata:
  name: sentry-hook-receiver
  namespace: sentry-kubernetes-operator-system
  labels:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/component: sentry-hook-receiver
spec:
  selector:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/component: sentry-hook-receiver
  ports:
  - name: webhook
    port: 8446
    targetPort: webhook
    protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sentry-hook-receiver
  namespace: sentry-kubernetes-operator-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentry-kubernetes-operator
      app.kubernetes.io/component: sentry-hook-receiver
