apiVersion: v1
kind: Service
metadata:
  name: registration-writer-challenge
  namespace: sentry-kubernetes-operator-system
  labels:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/component: registration-writer
spec:
  selector:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/component: registration-writer
  ports:
  - name: https
    port: 443
    targetPort: challenge
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: registration-writer-internal
  namespace: sentry-kubernetes-operator-system
  labels:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/component: registration-writer
spec:
  selector:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/component: registration-writer
  ports:
  - name: mtls
    port: 8445
    targetPort: internal
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: telegram-receiver
  namespace: sentry-kubernetes-operator-system
  labels:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/component: telegram-receiver
spec:
  selector:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/component: telegram-receiver
  ports:
  - name: webhook
    port: 443
    targetPort: webhook
    protocol: TCP
