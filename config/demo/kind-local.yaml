apiVersion: v1
kind: Namespace
metadata:
  name: sentry-demo-modern
---
apiVersion: v1
kind: Namespace
metadata:
  name: sentry-demo-legacy
---
apiVersion: v1
kind: Namespace
metadata:
  name: sentry-demo-surface
---
apiVersion: v1
kind: Namespace
metadata:
  name: sentry-demo-paused
---
apiVersion: sentryconfiguration.io/v1alpha1
kind: SentryConnection
metadata:
  name: demo-modern
spec:
  url: http://host.docker.internal:26101
  organization: sko-live-26-10-1
  credentials:
    tokenSecretRef:
      name: demo-sentry-api
      key: token
  transport:
    allowInsecureHTTP: true
  compatibility:
    alerts: modern-26.10.1
  integrations:
    slack:
      workspaces:
        - name: demo-slack
          sentryName: Demo Slack
    pagerDuty:
      accounts:
        - name: demo-pagerduty
          sentryName: SKO Demo PagerDuty
  access:
    - owner: demo
      namespaces:
        matchNames:
          - sentry-demo-modern
          - sentry-demo-surface
          - sentry-demo-paused
      teams:
        - sko-live
      allowCreate: true
      existingProjects:
        observe:
          - modern-demo
        consumeDSN:
          - modern-demo
      notificationTargets:
        slackWorkspaces:
          - demo-slack
        pagerDutyAccounts:
          - demo-pagerduty
        telegramTargets:
          - demo-chat
---
apiVersion: sentryconfiguration.io/v1alpha1
kind: SentryConnection
metadata:
  name: demo-legacy
spec:
  url: http://host.docker.internal:26101
  organization: sko-live-26-10-1
  credentials:
    tokenSecretRef:
      name: demo-sentry-api
      key: token
  transport:
    allowInsecureHTTP: true
  compatibility:
    alerts: legacy-24.7.1
  integrations:
    pagerDuty:
      accounts:
        - name: demo-pagerduty
          sentryName: SKO Demo PagerDuty
  access:
    - owner: demo
      namespaces:
        matchNames:
          - sentry-demo-legacy
      teams:
        - sko-live
      allowCreate: true
      notificationTargets:
        pagerDutyAccounts:
          - demo-pagerduty
---
apiVersion: sentryconfiguration.io/v1alpha1
kind: SentryProject
metadata:
  name: modern-demo
  namespace: sentry-demo-modern
spec:
  sentry: demo-modern
  project:
    create:
      team: sko-live
      platform: python
  dsn:
    secret: modern-demo-dsn
  settings:
    filters:
      browserExtensions: true
      localhost: true
      webCrawlers: true
    pii:
      scrubData: true
      scrubDefaults: true
      scrubIPAddresses: true
      sensitiveFields:
        - customer_token
      safeFields:
        - request_id
  notificationTargets:
    pagerDuty:
      demo-pagerduty:
        - Demo On-call
  alerts:
    error-volume:
      trigger: event-count
      windowMinutes: 5
      threshold: 10
      notify:
        - pagerDuty/Demo On-call
    disabled-volume:
      trigger: event-count
      windowMinutes: 15
      threshold: 100
      enabled: false
      notify:
        - pagerDuty/Demo On-call
  lifecycle:
    onDelete: DeleteProject
---
apiVersion: sentryconfiguration.io/v1alpha1
kind: SentryProject
metadata:
  name: legacy-demo
  namespace: sentry-demo-legacy
spec:
  sentry: demo-legacy
  project:
    create:
      team: sko-live
      platform: go
  dsn:
    secret: legacy-demo-dsn
  settings:
    filters:
      browserExtensions: false
      localhost: true
      webCrawlers: false
    pii:
      scrubData: true
      scrubDefaults: true
      scrubIPAddresses: false
  notificationTargets:
    pagerDuty:
      demo-pagerduty:
        - Demo On-call
  alerts:
    first-seen:
      trigger: first-seen
      notify:
        - pagerDuty/Demo On-call
    regression:
      trigger: regression
      notify:
        - pagerDuty/Demo On-call
    error-volume:
      trigger: event-count
      windowMinutes: 5
      threshold: 20
      notify:
        - pagerDuty/Demo On-call
  lifecycle:
    onDelete: DeleteProject
---
apiVersion: sentryconfiguration.io/v1alpha1
kind: SentryProject
metadata:
  name: destination-surface
  namespace: sentry-demo-surface
spec:
  sentry: demo-modern
  project:
    create:
      team: sko-live
      platform: javascript
  notificationTargets:
    pagerDuty:
      demo-pagerduty:
        - Demo On-call
    slack:
      demo-slack:
        - demo-alerts
    telegram:
      - demo-chat
  lifecycle:
    onDelete: DeleteProject
---
apiVersion: sentryconfiguration.io/v1alpha1
kind: SentryProject
metadata:
  name: paused-demo
  namespace: sentry-demo-paused
spec:
  sentry: demo-modern
  paused: true
  project:
    create:
      team: sko-live
      platform: python
