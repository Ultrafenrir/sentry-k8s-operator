# Render this canonical template through hack/render-registration-gateway.sh or Helm.
# The uppercase tokens are intentionally invalid Kubernetes names so this file cannot be
# applied accidentally without choosing the installation-owned Gateway and public hosts.
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: telegram-receiver
  namespace: sentry-kubernetes-operator-system
  labels:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/component: telegram-receiver
    app.kubernetes.io/managed-by: kustomize
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: GATEWAY_NAME
    namespace: GATEWAY_NAMESPACE
    sectionName: GATEWAY_LISTENER
  hostnames:
  - TELEGRAM_HOSTNAME
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: telegram-receiver
      port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: sentry-hook-receiver
  namespace: sentry-kubernetes-operator-system
  labels:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/component: sentry-hook-receiver
    app.kubernetes.io/managed-by: kustomize
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: GATEWAY_NAME
    namespace: GATEWAY_NAMESPACE
    sectionName: GATEWAY_LISTENER
  hostnames:
  - SENTRY_HOSTNAME
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: sentry-hook-receiver
      port: 8446
