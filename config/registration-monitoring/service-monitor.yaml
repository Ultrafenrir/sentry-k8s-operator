apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: telegram-delivery-worker
  namespace: sentry-kubernetes-operator-system
  labels:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/component: telegram-delivery-worker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sentry-kubernetes-operator
      app.kubernetes.io/component: telegram-delivery-worker
  namespaceSelector:
    matchNames:
    - sentry-kubernetes-operator-system
  endpoints:
  - port: metrics
    path: /metrics
    interval: 15s
    scrapeTimeout: 5s
