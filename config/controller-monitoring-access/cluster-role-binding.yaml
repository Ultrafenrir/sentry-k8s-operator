# Render through hack/render-controller-monitoring-access.sh or Helm. The uppercase
# placeholders are intentionally invalid names to prevent accidental broad access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sentry-kubernetes-operator-controller-metrics-reader
  labels:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/component: controller-manager
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sentry-kubernetes-operator-metrics-reader
subjects:
- kind: ServiceAccount
  name: PROMETHEUS_SERVICE_ACCOUNT_NAME
  namespace: PROMETHEUS_SERVICE_ACCOUNT_NAMESPACE
