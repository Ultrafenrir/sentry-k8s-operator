apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sentry-kubernetes-operator-immutable-audit
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - UPDATE
      resources:
      - secrets
      scope: Namespaced
  matchConditions:
  - name: immutable-audit-record
    expression: >-
      has(oldObject.metadata.labels) &&
      oldObject.metadata.labels['sentryconfiguration.io/record-type'] == 'mutation-audit'
  validations:
  - expression: "false"
    message: mutation audit records are append-only and cannot be updated
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sentry-kubernetes-operator-immutable-audit
spec:
  policyName: sentry-kubernetes-operator-immutable-audit
  validationActions:
  - Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/component: protected-audit
