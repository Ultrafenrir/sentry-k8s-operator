apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentry-kubernetes-operator-protected-state-manager
  namespace: sentry-kubernetes-operator-state
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentry-kubernetes-operator-protected-state-manager-rolebinding
  namespace: sentry-kubernetes-operator-state
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentry-kubernetes-operator-protected-state-manager
subjects:
- kind: ServiceAccount
  name: sentry-kubernetes-operator-controller-manager
  namespace: sentry-kubernetes-operator-system
