apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentry-kubernetes-operator-protected-hook-source-manager
  namespace: sentry-kubernetes-operator-hook-sources
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentry-kubernetes-operator-protected-hook-source-manager-rolebinding
  namespace: sentry-kubernetes-operator-hook-sources
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentry-kubernetes-operator-protected-hook-source-manager
subjects:
- kind: ServiceAccount
  name: sentry-kubernetes-operator-controller-manager
  namespace: sentry-kubernetes-operator-system
