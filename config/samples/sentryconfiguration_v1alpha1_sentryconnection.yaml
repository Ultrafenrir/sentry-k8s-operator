apiVersion: sentryconfiguration.io/v1alpha1
kind: SentryConnection
metadata:
  labels:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/managed-by: kustomize
  name: company-sentry
spec:
  url: https://sentry.example.invalid
  organization: company
  credentials:
    tokenSecretRef:
      name: company-sentry-api
      key: token
  ownership:
    region: eu-west-1
    role: Active
    revision: 1
  projectManagement:
    unmanagedProjects: Reject
  compatibility:
    alerts: legacy-24.7.1
  integrations:
    slack:
      workspaces:
        - name: company-slack
          sentryName: Company Slack
    pagerDuty:
      accounts:
        - name: company-pagerduty
          sentryName: Company PagerDuty
  access:
    - owner: payments
      namespaces:
        matchNames:
          - checkout-prod
      teams:
        - payments
        - platform-observability
      allowCreate: true
      existingProjects:
        observe:
          - checkout-api
        consumeDSN:
          - checkout-api
      notificationTargets:
        slackWorkspaces:
          - company-slack
        pagerDutyAccounts:
          - company-pagerduty
        telegramTargets:
          - payments-alerts
