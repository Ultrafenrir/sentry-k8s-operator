apiVersion: sentryconfiguration.io/v1alpha1
kind: SentryProject
metadata:
  labels:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/managed-by: kustomize
  name: checkout-observer
  namespace: checkout-prod
spec:
  sentry: company-sentry
  project:
    use: checkout-api
  dsn:
    secret: checkout-observer-sentry
    clientKey: default
  lifecycle:
    onDelete: Retain
