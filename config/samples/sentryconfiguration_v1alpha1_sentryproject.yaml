apiVersion: sentryconfiguration.io/v1alpha1
kind: SentryProject
metadata:
  labels:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/managed-by: kustomize
  name: checkout
  namespace: checkout-prod
spec:
  sentry: company-sentry
  role: Active
  project:
    create:
      team: payments
  grantAccess:
    teams:
      - platform-observability
  notificationTargets:
    slack:
      company-slack:
        - payments-alerts
    pagerDuty:
      company-pagerduty:
        - Payments Primary
  alerts:
    new-errors:
      trigger: first-seen
      notify:
        - slack/payments-alerts
    error-volume:
      trigger: event-count
      windowMinutes: 5
      threshold: 200
      notify:
        - slack/payments-alerts
        - pagerDuty/Payments Primary
    affected-users:
      trigger: user-count
      windowMinutes: 10
      threshold: 50
      notify:
        - pagerDuty/Payments Primary
