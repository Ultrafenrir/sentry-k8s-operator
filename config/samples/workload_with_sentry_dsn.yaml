apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: checkout-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
      - name: checkout
        image: busybox:1.36
        command: ["sh", "-c", "exec sleep 365d"]
        env:
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: checkout-sentry
              key: SENTRY_DSN
              optional: false
