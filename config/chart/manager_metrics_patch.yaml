- op: add
  path: /spec/template/spec/containers/0/args/0
  value: --metrics-bind-address=:8443
- op: add
  path: /spec/template/spec/containers/0/args/1
  value: --metrics-secure=false
- op: add
  path: /spec/template/spec/containers/0/ports/0
  value:
    name: metrics
    containerPort: 8443
    protocol: TCP
