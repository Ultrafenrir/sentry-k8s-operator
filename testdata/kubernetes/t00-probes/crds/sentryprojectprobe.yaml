apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sentryprojectprobes.t00.sentry-operator.dev
spec:
  group: t00.sentry-operator.dev
  scope: Namespaced
  conversion:
    strategy: None
  names:
    plural: sentryprojectprobes
    singular: sentryprojectprobe
    kind: SentryProjectProbe
    listKind: SentryProjectProbeList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - project
              properties:
                project:
                  type: object
                  properties:
                    create:
                      type: object
                      required:
                        - team
                      properties:
                        team:
                          type: string
                          minLength: 1
                    use:
                      type: string
                      minLength: 1
                  x-kubernetes-validations:
                    - rule: has(self.create) != has(self.use)
                      message: exactly one of project.create or project.use is required
                settings:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                destinations:
                  type: object
                  maxProperties: 20
                  additionalProperties:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                alerts:
                  type: object
                  maxProperties: 50
                  additionalProperties:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                paused:
                  type: boolean
                  default: false
                dsn:
                  type: object
                  properties:
                    secret:
                      type: string
                      minLength: 1
                lifecycle:
                  type: object
                  default: {}
                  properties:
                    onDelete:
                      type: string
                      default: Retain
                      enum:
                        - Retain
                        - DeleteProject
              x-kubernetes-validations:
                - rule: "!has(self.project.use) || !(has(self.settings) || has(self.destinations) || has(self.alerts))"
                  message: project.use forbids settings, destinations and alerts
                - rule: "!has(self.project.use) || self.lifecycle.onDelete != 'DeleteProject'"
                  message: project.use forbids lifecycle.onDelete DeleteProject
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                registrationCommit:
                  type: string
