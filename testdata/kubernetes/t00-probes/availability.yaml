apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdb-probe
  namespace: sentry-operator-t00-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pdb-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pdb-probe
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-probe
  namespace: sentry-operator-t00-probe
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pdb-probe
