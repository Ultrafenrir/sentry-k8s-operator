apiVersion: v1
kind: ServiceAccount
metadata:
  name: status-writer
  namespace: sentry-operator-t00-probe
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: status-writer
  namespace: sentry-operator-t00-probe
rules:
  - apiGroups:
      - t00.sentry-operator.dev
    resources:
      - sentryprojectprobes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - t00.sentry-operator.dev
    resources:
      - sentryprojectprobes/status
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: status-writer
  namespace: sentry-operator-t00-probe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: status-writer
subjects:
  - kind: ServiceAccount
    name: status-writer
    namespace: sentry-operator-t00-probe
