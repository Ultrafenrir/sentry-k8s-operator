apiVersion: sentryconfiguration.io/v1alpha1
kind: SentryProject
metadata:
  name: invalid-advanced-settings
  namespace: checkout-prod
spec:
  sentry: company-sentry
  project:
    create:
      team: payments
  settings:
    pii:
      advancedRules:
        - type: pattern
          redaction: replace
          applications:
            - root: message
              path:
                - forbidden
    grouping:
      enhancements:
        - matcher: path
          pattern: "*/vendor/*"
          action: RawAction
      fingerprints:
        - matcher: message
          pattern: timeout
