apiVersion: sentryconfiguration.io/v1alpha1
kind: SentryProject
metadata:
  name: unattached-issue-ownership-team
  namespace: checkout-prod
spec:
  sentry: company-sentry
  team: payments
  issueOwnership:
    rules:
      - matcher:
          type: path
          pattern: src/security/*
        teams:
          - security
    fallthrough: NoOne
    autoAssignment: Disabled
    codeownersAutoSync: false
