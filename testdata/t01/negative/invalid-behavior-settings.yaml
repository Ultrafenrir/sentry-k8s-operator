apiVersion: sentryconfiguration.io/v1alpha1
kind: SentryProject
metadata:
  name: invalid-behavior-settings
  namespace: checkout-prod
spec:
  sentry: company-sentry
  project:
    create:
      team: payments
  settings:
    behavior:
      autoResolveHours: -1
      defaultEnvironment: production/internal
      crashReportLimit: 101
      allowedDomains:
        - "*"
        - example.com
