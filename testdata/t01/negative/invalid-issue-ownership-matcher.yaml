apiVersion: sentryconfiguration.io/v1alpha1
kind: SentryProject
metadata:
  name: invalid-issue-ownership-matcher
  namespace: checkout-prod
spec:
  sentry: company-sentry
  project:
    create:
      team: payments
  issueOwnership:
    rules:
      - matcher:
          type: tag
          pattern: production
        teams:
          - payments
    fallthrough: NoOne
    autoAssignment: IssueOwner
    codeownersAutoSync: true
