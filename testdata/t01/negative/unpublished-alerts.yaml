apiVersion: sentryconfiguration.io/v1alpha1
kind: SentryProject
metadata:
  name: invalid-alert-shape
  namespace: checkout-prod
spec:
  sentry: company-sentry
  team: payments
  notificationTargets:
    slack:
      company-slack:
        - payments-alerts
  alerts:
    broken-count:
      trigger: event-count
      windowMinutes: 5
      notify:
        - slack/payments-alerts
