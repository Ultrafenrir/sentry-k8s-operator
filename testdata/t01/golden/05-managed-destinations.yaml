apiVersion: sentryconfiguration.io/v1alpha1
kind: SentryProject
metadata:
  name: checkout-destinations
  namespace: checkout-prod
spec:
  sentry: company-sentry
  project:
    create:
      team: payments
  notificationTargets:
    slack:
      company-slack:
        - payments-alerts
    pagerDuty:
      company-pagerduty:
        - Payments Primary
    telegram:
      - payments-alerts
