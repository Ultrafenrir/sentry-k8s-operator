apiVersion: sentryconfiguration.io/v1alpha1
kind: SentryProject
metadata:
  name: checkout-settings
  namespace: checkout-prod
spec:
  sentry: company-sentry
  project:
    create:
      team: payments
      platform: python
  grantAccess:
    teams:
      - platform-observability
  settings:
    filters:
      browserExtensions: true
      localhost: false
      webCrawlers: true
    pii:
      scrubData: true
      scrubDefaults: true
      scrubIPAddresses: false
      sensitiveFields:
        - authorization
        - password
      safeFields: []
