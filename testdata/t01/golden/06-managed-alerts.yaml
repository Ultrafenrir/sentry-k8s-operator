apiVersion: sentryconfiguration.io/v1alpha1
kind: SentryProject
metadata:
  name: checkout-alerts
  namespace: checkout-prod
spec:
  sentry: company-sentry
  project:
    create:
      team: payments
  notificationTargets:
    slack:
      company-slack:
        - payments-alerts
    pagerDuty:
      company-pagerduty:
        - Payments Primary
  alerts:
    new-errors:
      trigger: first-seen
      notify:
        - slack/payments-alerts
    error-volume:
      trigger: event-count
      windowMinutes: 5
      threshold: 200
      notify:
        - slack/payments-alerts
        - pagerDuty/Payments Primary
    affected-users:
      trigger: user-count
      windowMinutes: 10
      threshold: 50
      notify:
        - pagerDuty/Payments Primary
