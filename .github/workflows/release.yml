name: Release image

on:
  push:
    tags:
      - v*

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build, sign and verify immutable image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate release tag and image name
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          printf 'RELEASE_TAG=ghcr.io/%s:%s\n' "$repository" "$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Set up cross-platform emulation
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Install pinned cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push digest with SBOM and provenance
        run: make docker-buildx IMG="$RELEASE_TAG"

      - name: Sign exact pushed digest with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' dist/build-metadata.json)
          repository=${RELEASE_TAG%:*}
          cosign sign --yes "${repository}@${digest}"

      - name: Verify exact digest and release workflow identity
        shell: bash
        run: |
          set -euo pipefail
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' dist/build-metadata.json)
          repository=${RELEASE_TAG%:*}
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          make verify-signed-image IMG="${repository}@${digest}" COSIGN_CERTIFICATE_IDENTITY="$identity"
