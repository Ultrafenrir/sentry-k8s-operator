name: Release Docker image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ultrafenrir
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image
        run: docker build -t docker.io/ultrafenrir/sentry-k8s-operator:${GITHUB_REF_NAME} .
      - name: Push image
        run: docker push docker.io/ultrafenrir/sentry-k8s-operator:${GITHUB_REF_NAME}
