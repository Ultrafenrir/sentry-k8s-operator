name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint and generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - uses: azure/setup-helm@v4
      - name: Install controller-gen
        run: go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.21.0
      - name: Run lint
        run: make lint
      - name: Verify generated files are committed
        run: git diff --exit-code

  test:
    name: Unit and envtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Install test tools
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.21.0
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.24
      - name: Configure envtest
        run: echo "KUBEBUILDER_ASSETS=$(setup-envtest use -p path 1.35.0)" >> "$GITHUB_ENV"
      - name: Run tests
        run: make test
