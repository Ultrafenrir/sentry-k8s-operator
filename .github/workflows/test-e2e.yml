name: E2E Tests

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: 1.26.10

      - name: Install pinned generators and kind
        run: |
          test "$(go env GOARCH)" = amd64
          mkdir -p .tools/bin
          GOBIN="$PWD/.tools/bin" go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.21.0
          curl --fail --location --retry 3 \
            --output .tools/bin/kind \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
          echo '50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  .tools/bin/kind' | sha256sum -c -
          chmod +x .tools/bin/kind

      - name: Verify kind installation
        run: .tools/bin/kind version

      - name: Verify modules
        run: go mod verify

      - name: Run pinned Kubernetes 1.35 e2e
        run: |
          make test-e2e \
            KIND=.tools/bin/kind \
            KIND_NODE_IMAGE=kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
