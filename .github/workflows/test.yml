name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Kubernetes ${{ matrix.kubernetes }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kubernetes:
          - 1.35.0
          - 1.36.2
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: 1.26.10

      - name: Install pinned generators and envtest manager
        run: |
          mkdir -p .tools/bin
          GOBIN="$PWD/.tools/bin" go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.21.0
          GOBIN="$PWD/.tools/bin" go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.24

      - name: Install pinned Kubernetes API server
        run: |
          assets=$(.tools/bin/setup-envtest use "${{ matrix.kubernetes }}" -p path)
          test -x "$assets/kube-apiserver"
          echo "KUBEBUILDER_ASSETS=$assets" >> "$GITHUB_ENV"

      - name: Verify modules
        run: go mod verify

      - name: Run tests and sample admission validation
        run: |
          make test KUBEBUILDER_ASSETS="$KUBEBUILDER_ASSETS"

      - name: Verify deterministic failure contracts
        if: matrix.kubernetes == '1.35.0'
        env:
          GOMODCACHE: ${{ runner.temp }}/sentry-operator-gomodcache
          GOCACHE: ${{ runner.temp }}/sentry-operator-gocache
        run: make verify-t10-failure-injection
