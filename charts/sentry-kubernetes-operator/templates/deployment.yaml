apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentry-kubernetes-operator.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentry-kubernetes-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sentry-kubernetes-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sentry-kubernetes-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sentry-kubernetes-operator.fullname" . }}-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "sentry-kubernetes-operator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/manager"]
          args:
            - --metrics-bind-address=:8443
            - --metrics-secure=false
            - --leader-elect
            - --leader-election-id={{ include "sentry-kubernetes-operator.fullname" . }}
            - --health-probe-bind-address=:8081
            - --state-namespace={{ .Release.Namespace }}
            - --audit-namespace={{ .Release.Namespace }}
            - --managed-by={{ include "sentry-kubernetes-operator.fullname" . }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
