apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentry-kubernetes-operator.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentry-kubernetes-operator.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: 8443
      protocol: TCP
      targetPort: metrics
  selector:
    {{- include "sentry-kubernetes-operator.selectorLabels" . | nindent 4 }}
