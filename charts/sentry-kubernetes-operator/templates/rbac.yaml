apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sentry-kubernetes-operator.clusterRoleName" . }}
  labels:
    {{- include "sentry-kubernetes-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["sentry-dsn"]
    verbs: ["get", "patch", "update"]
  # Kubernetes cannot restrict create by resourceNames because the authorization
  # request targets the Secret collection. Controller code creates only sentry-dsn.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["sentry-project-inputs"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["sentry-uptime-inputs"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["sentryconfiguration.io"]
    resources: ["sentryalertpolicies"]
    verbs: ["get", "list", "patch", "update", "watch"]
  - apiGroups: ["sentryconfiguration.io"]
    resources: ["sentryconnections"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["sentryconfiguration.io"]
    resources: ["sentryprojects"]
    verbs: ["get", "list", "patch", "watch"]
  - apiGroups: ["sentryconfiguration.io"]
    resources: ["sentrycronmonitors", "sentryuptimemonitors"]
    verbs: ["delete", "get", "list", "patch", "watch"]
  - apiGroups: ["sentryconfiguration.io"]
    resources: ["sentryalertpolicies/status", "sentryconnections/status", "sentryprojects/status", "sentrycronmonitors/status", "sentryuptimemonitors/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sentry-kubernetes-operator.clusterRoleName" . }}
  labels:
    {{- include "sentry-kubernetes-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sentry-kubernetes-operator.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sentry-kubernetes-operator.fullname" . }}-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sentry-kubernetes-operator.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentry-kubernetes-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sentry-kubernetes-operator.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentry-kubernetes-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sentry-kubernetes-operator.fullname" . }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "sentry-kubernetes-operator.fullname" . }}-controller
    namespace: {{ .Release.Namespace }}
