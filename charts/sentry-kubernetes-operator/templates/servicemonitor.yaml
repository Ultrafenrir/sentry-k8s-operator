{{- if .Values.controllerMonitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "sentry-kubernetes-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentry-kubernetes-operator.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "sentry-kubernetes-operator.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  endpoints:
    - port: http
      path: /metrics
      scheme: http
      interval: 30s
{{- end }}
