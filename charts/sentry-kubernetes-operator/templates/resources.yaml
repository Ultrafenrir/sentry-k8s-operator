{{- $image := include "sentry-kubernetes-operator.image" . -}}
{{- $pullPolicy := printf "imagePullPolicy: %s" .Values.image.pullPolicy -}}
{{- $state := .Files.Get "files/state.yaml" | replace "app.kubernetes.io/managed-by: kustomize" "app.kubernetes.io/managed-by: Helm" -}}
{{ $state }}
---
{{ $operator := .Files.Get "files/operator.yaml" | replace "controller:latest" $image | replace "imagePullPolicy: IfNotPresent" $pullPolicy | replace "app.kubernetes.io/managed-by: kustomize" "app.kubernetes.io/managed-by: Helm" }}
{{ $operator }}
---
apiVersion: sentryconfiguration.io/v1alpha1
kind: SentryConnection
metadata:
  name: {{ .Values.sentryConnection.name | quote }}
  labels:
    app.kubernetes.io/name: sentry-kubernetes-operator
    app.kubernetes.io/managed-by: Helm
spec:
{{ toYaml .Values.sentryConnection.spec | indent 2 }}
{{ if .Values.controllerMonitoring.enabled }}
---
{{ .Files.Get "files/controller-monitoring.yaml" | replace "app.kubernetes.io/managed-by: kustomize" "app.kubernetes.io/managed-by: Helm" }}
{{ end }}
