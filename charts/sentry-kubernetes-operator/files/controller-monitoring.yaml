apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/component: controller-manager
    app.kubernetes.io/name: sentry-kubernetes-operator
  name: sentry-kubernetes-operator-controller
  namespace: sentry-kubernetes-operator-system
spec:
  groups:
  - name: sentry-kubernetes-operator.controller
    rules:
    - alert: SentryOperatorReconcileErrors
      annotations:
        description: Inspect fixed-enum metrics, redacted conditions and Kubernetes
          Events; do not dump credential or protected-state Secrets.
        summary: Sentry operator reconciliation is returning errors
      expr: sum by (controller) (increase(sentry_operator_reconciles_total{outcome="error"}[10m]))
        > 0
      for: 5m
      labels:
        severity: warning
    - alert: SentryOperatorConditionFailureBurst
      annotations:
        description: Use condition reason and the redacted admin report to identify
          the affected component without exposing external identities.
        summary: Sentry operator resources are entering failed conditions repeatedly
      expr: sum by (controller, condition) (increase(sentry_operator_condition_transitions_total{status="False"}[10m]))
        > 5
      for: 5m
      labels:
        severity: warning
    - alert: SentryOperatorSynchronizationBlocked
      annotations:
        description: Inspect the reported mechanism and redacted SentryProject conditions;
          resource names and external identities are intentionally not metric labels.
        summary: Sentry project synchronization is blocked
      expr: sum by (mechanism) (sentry_operator_sync_resources{state="blocked"}) >
        0
      for: 10m
      labels:
        severity: warning
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/component: controller-manager
    app.kubernetes.io/name: sentry-kubernetes-operator
  name: sentry-kubernetes-operator-controller
  namespace: sentry-kubernetes-operator-system
spec:
  endpoints:
  - interval: 30s
    path: /metrics
    port: http
    scheme: http
    scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
    - sentry-kubernetes-operator-system
  selector:
    matchLabels:
      app.kubernetes.io/name: sentry-kubernetes-operator
      control-plane: controller-manager
