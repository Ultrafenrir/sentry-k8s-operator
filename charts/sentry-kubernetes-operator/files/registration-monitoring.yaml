apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/component: telegram-delivery-worker
    app.kubernetes.io/name: sentry-kubernetes-operator
  name: telegram-delivery-worker
  namespace: sentry-kubernetes-operator-system
spec:
  groups:
  - name: sentry-kubernetes-operator.telegram-delivery
    rules:
    - alert: SentryOperatorTelegramDeliveryQueueStalled
      annotations:
        description: Inspect the redacted admin report and worker fixed-enum metrics;
          do not dump queue Secrets.
        summary: Telegram delivery queue has been outstanding for more than five minutes
      expr: max(sentry_operator_telegram_delivery_oldest_outstanding_seconds) > 300
      for: 10m
      labels:
        severity: warning
    - alert: SentryOperatorTelegramDeliveryDeadLetters
      annotations:
        description: Use aggregate queue state and the recovery runbook; message payload
          and target are protected data.
        summary: Telegram delivery records entered the dead-letter queue
      expr: sum(increase(sentry_operator_telegram_delivery_attempts_total{outcome="dead_letter"}[10m]))
        > 0
      for: 1m
      labels:
        severity: warning
    - alert: SentryOperatorTelegramDeliveryMetricsRefreshFailing
      annotations:
        description: Check worker Kubernetes API reachability and delivery namespace
          RBAC without exposing Secret data.
        summary: Telegram delivery queue metrics cannot be refreshed
      expr: sum(increase(sentry_operator_telegram_delivery_metrics_refresh_errors_total[10m]))
        > 0
      for: 5m
      labels:
        severity: warning
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/component: telegram-delivery-worker
    app.kubernetes.io/name: sentry-kubernetes-operator
  name: telegram-delivery-worker
  namespace: sentry-kubernetes-operator-system
spec:
  endpoints:
  - interval: 15s
    path: /metrics
    port: metrics
    scrapeTimeout: 5s
  namespaceSelector:
    matchNames:
    - sentry-kubernetes-operator-system
  selector:
    matchLabels:
      app.kubernetes.io/component: telegram-delivery-worker
      app.kubernetes.io/name: sentry-kubernetes-operator
