        app.kubernetes.io/name: sentry-kubernetes-operator
    spec:
      automountServiceAccountToken: true
      containers:
      - args:
        - --address=:8447
        - --health-address=:8081
        - --tls-cert-file=/var/run/sentry-hook/server/tls.crt
        - --tls-key-file=/var/run/sentry-hook/server/tls.key
        - --client-ca-file=/var/run/sentry-hook/ca/tls.crt
        - --allowed-client-uri=spiffe://cluster.local/ns/sentry-kubernetes-operator-system/sa/sentry-hook-receiver
        - --hook-source-namespace=sentry-kubernetes-operator-hook-sources
        - --delivery-namespace=sentry-kubernetes-operator-delivery
        command:
        - /sentry-hook-producer
        image: controller:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
