        - --tls-key-file=/var/run/telegram/webhook-tls/tls.key
        - --telegram-secret-file=/var/run/telegram/auth/secret-token
        - --writer-url=https://registration-writer-internal.sentry-kubernetes-operator-system.svc:8445/internal/v1/telegram/redemptions
        - --writer-ca-file=/var/run/telegram/writer-ca/tls.crt
        - --writer-cert-file=/var/run/telegram/writer-client/tls.crt
