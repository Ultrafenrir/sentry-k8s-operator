          timeoutSeconds: 2
        name: producer
        ports:
        - containerPort: 8447
          name: internal
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: health
            scheme: HTTP
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 250m
            memory: 96Mi
          requests:
            cpu: 10m
            memory: 24Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /var/run/sentry-hook/server
          name: server-tls
          readOnly: true
        - mountPath: /var/run/sentry-hook/ca
          name: client-ca
          readOnly: true
      securityContext:
        runAsNonRoot: true
