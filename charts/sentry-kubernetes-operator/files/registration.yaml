apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: registration-writer
    app.kubernetes.io/name: sentry-kubernetes-operator
  name: registration-writer
  namespace: sentry-kubernetes-operator-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: registration-writer
      app.kubernetes.io/name: sentry-kubernetes-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/component: registration-writer
        app.kubernetes.io/name: sentry-kubernetes-operator
    spec:
      automountServiceAccountToken: true
      containers:
      - args:
        - --challenge-address=:8444
        - --internal-address=:8445
        - --tls-cert-file=/var/run/registration/server/tls.crt
        - --tls-key-file=/var/run/registration/server/tls.key
        - --client-ca-file=/var/run/registration/ca/tls.crt
        - --receiver-client-uri=spiffe://cluster.local/ns/sentry-kubernetes-operator-system/sa/telegram-receiver
        - --token-audience=sentry-registration
        - --state-namespace=sentry-kubernetes-operator-state
        - --routing-namespace=sentry-kubernetes-operator-routing
        - --audit-namespace=sentry-kubernetes-operator-audit
        command:
        - /registration-writer
        image: controller:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: challenge
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
        name: writer
        ports:
        - containerPort: 8444
          name: challenge
          protocol: TCP
        - containerPort: 8445
          name: internal
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: challenge
            scheme: HTTPS
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /var/run/registration/server
          name: server-tls
          readOnly: true
        - mountPath: /var/run/registration/ca
          name: client-ca
          readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: registration-writer
      volumes:
      - name: server-tls
        secret:
          secretName: registration-writer-server-tls
      - name: client-ca
        secret:
          items:
          - key: tls.crt
            path: tls.crt
          secretName: registration-ca
---
apiVersion: apps/v1
