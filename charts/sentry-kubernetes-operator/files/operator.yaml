  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: sentry-kubernetes-operator
  name: sentry-kubernetes-operator-leader-election-role
  namespace: sentry-kubernetes-operator-system
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sentry-kubernetes-operator-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - sentryconfiguration.io
  resources:
  - sentryalertpolicies
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sentryconfiguration.io
  resources:
  - sentryalertpolicies/status
  - sentryconnections/status
  - sentryprojects/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - sentryconfiguration.io
  resources:
  - sentryconnections
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sentryconfiguration.io
  resources:
  - sentryprojects
  verbs:
  - get
  - list
  - patch
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentry-kubernetes-operator-connection-secret-reader-rolebinding
  namespace: sentry-kubernetes-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentry-kubernetes-operator-connection-secret-reader
subjects:
- kind: ServiceAccount
  name: sentry-kubernetes-operator-controller-manager
  namespace: sentry-kubernetes-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: sentry-kubernetes-operator
  name: sentry-kubernetes-operator-leader-election-rolebinding
  namespace: sentry-kubernetes-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentry-kubernetes-operator-leader-election-role
subjects:
- kind: ServiceAccount
  name: sentry-kubernetes-operator-controller-manager
  namespace: sentry-kubernetes-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: sentry-kubernetes-operator
  name: sentry-kubernetes-operator-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sentry-kubernetes-operator-manager-role
subjects:
- kind: ServiceAccount
  name: sentry-kubernetes-operator-controller-manager
  namespace: sentry-kubernetes-operator-system
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: sentry-kubernetes-operator
    control-plane: controller-manager
  name: sentry-kubernetes-operator-controller-manager-metrics-service
  namespace: sentry-kubernetes-operator-system
spec:
  ports:
  - name: http
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    app.kubernetes.io/name: sentry-kubernetes-operator
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: sentry-kubernetes-operator
    control-plane: controller-manager
  name: sentry-kubernetes-operator-controller-manager
  namespace: sentry-kubernetes-operator-system
spec:
  minReadySeconds: 5
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sentry-kubernetes-operator
      control-plane: controller-manager
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: sentry-kubernetes-operator
        control-plane: controller-manager
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: sentry-kubernetes-operator
                  control-plane: controller-manager
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --metrics-secure=false
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --state-namespace=sentry-kubernetes-operator-state
        - --audit-namespace=sentry-kubernetes-operator-audit
        - --audit-gc-interval=10m
        - --audit-retention=720h
        - --audit-gc-batch=100
        command:
        - /manager
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: controller:latest
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8443
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts: []
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: sentry-kubernetes-operator-controller-manager
      terminationGracePeriodSeconds: 10
      volumes: []
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app.kubernetes.io/name: sentry-kubernetes-operator
    control-plane: controller-manager
  name: sentry-kubernetes-operator-controller-manager
  namespace: sentry-kubernetes-operator-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentry-kubernetes-operator
      control-plane: controller-manager
