apiVersion: v1
kind: Namespace
metadata:
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/component: protected-audit
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: sentry-kubernetes-operator
  name: sentry-kubernetes-operator-audit
---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/component: protected-state
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: sentry-kubernetes-operator
  name: sentry-kubernetes-operator-state
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentry-kubernetes-operator-protected-audit-manager
  namespace: sentry-kubernetes-operator-audit
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - create
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentry-kubernetes-operator-protected-audit-reader
  namespace: sentry-kubernetes-operator-audit
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentry-kubernetes-operator-protected-state-manager
  namespace: sentry-kubernetes-operator-state
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentry-kubernetes-operator-protected-audit-manager-rolebinding
  namespace: sentry-kubernetes-operator-audit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentry-kubernetes-operator-protected-audit-manager
subjects:
- kind: ServiceAccount
  name: sentry-kubernetes-operator-controller-manager
  namespace: sentry-kubernetes-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentry-kubernetes-operator-protected-state-manager-rolebinding
  namespace: sentry-kubernetes-operator-state
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentry-kubernetes-operator-protected-state-manager
subjects:
- kind: ServiceAccount
  name: sentry-kubernetes-operator-controller-manager
  namespace: sentry-kubernetes-operator-system
