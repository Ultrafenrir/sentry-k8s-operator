apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sentry-kubernetes-operator-immutable-audit
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: has(oldObject.metadata.labels) && oldObject.metadata.labels['sentryconfiguration.io/record-type']
      == 'mutation-audit'
    name: immutable-audit-record
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - UPDATE
      resources:
      - secrets
      scope: Namespaced
  validations:
  - expression: "false"
    message: mutation audit records are append-only and cannot be updated
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sentry-kubernetes-operator-immutable-audit
spec:
  matchResources:
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/component: protected-audit
  policyName: sentry-kubernetes-operator-immutable-audit
  validationActions:
  - Deny
