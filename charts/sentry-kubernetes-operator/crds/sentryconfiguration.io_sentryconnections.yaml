---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: sentryconnections.sentryconfiguration.io
spec:
  group: sentryconfiguration.io
  names:
    kind: SentryConnection
    listKind: SentryConnectionList
    plural: sentryconnections
    singular: sentryconnection
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.serverVersion
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SentryConnection is the Schema for the sentryconnections API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of SentryConnection
            properties:
              access:
                items:
                  description: AccessRule binds one trusted owner to namespace, project
                    and destination policy.
                  properties:
                    allowCreate:
                      type: boolean
                    existingProjects:
                      description: ExistingProjectAccess grants read-only visibility
                        and optional DSN consumption by slug.
                      properties:
                        consumeDSN:
                          items:
                            maxLength: 64
                            minLength: 1
                            type: string
                          maxItems: 100
                          type: array
                          x-kubernetes-list-type: set
                        observe:
                          items:
                            maxLength: 64
                            minLength: 1
                            type: string
                          maxItems: 100
                          type: array
                          x-kubernetes-list-type: set
                      type: object
                    namespaces:
                      description: NamespaceAccess selects namespaces by exact, human-readable
                        name.
                      properties:
                        matchNames:
                          items:
                            maxLength: 63
                            minLength: 1
                            type: string
                          maxItems: 100
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: set
                      required:
                      - matchNames
                      type: object
                    notificationTargets:
                      description: NotificationTargets grants integration aliases,
                        never channel or service allowlists.
                      properties:
                        pagerDutyAccounts:
                          items:
                            type: string
                          maxItems: 100
                          type: array
                          x-kubernetes-list-type: set
                        slackWorkspaces:
                          items:
                            type: string
                          maxItems: 100
                          type: array
                          x-kubernetes-list-type: set
                        telegramTargets:
                          items:
                            type: string
                          maxItems: 100
                          type: array
                          x-kubernetes-list-type: set
                      type: object
                    owner:
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z](?:[a-z0-9.-]*[a-z0-9])?$
                      type: string
                    teams:
                      items:
                        maxLength: 64
                        minLength: 1
                        type: string
                      maxItems: 50
                      type: array
                      x-kubernetes-list-type: set
                  required:
                  - namespaces
                  - owner
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-map-keys:
                - owner
                x-kubernetes-list-type: map
              compatibility:
                description: Compatibility is required before version-sensitive APIs
                  such as alerts are mutated.
                properties:
                  alerts:
                    description: |-
                      AlertCompatibilityProfile is an explicit platform assertion about the target Sentry
                      alert API. The operator never infers this safety boundary from an unstable version route.
                    enum:
                    - legacy-24.7.1
                    - modern-26.10.1
                    type: string
                type: object
              credentials:
                description: ConnectionCredentials contains platform-owned Sentry
                  API credentials.
                properties:
                  caBundleSecretRef:
                    description: |-
                      SecretKeyReference identifies one key in a Secret from the fixed operator namespace.
                      Namespace is intentionally not user-configurable.
                    properties:
                      key:
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  tokenSecretRef:
                    description: |-
                      SecretKeyReference identifies one key in a Secret from the fixed operator namespace.
                      Namespace is intentionally not user-configurable.
                    properties:
                      key:
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - tokenSecretRef
                type: object
              integrations:
                description: ConnectionIntegrations contains optional platform integration
                  defaults.
                properties:
                  pagerDuty:
                    description: PagerDutyIntegration declares readable aliases for
                      already-installed accounts.
                    properties:
                      accounts:
                        items:
                          description: |-
                            IntegrationCatalogEntry maps one stable local alias to one already-installed Sentry
                            integration name. Declaring an entry never installs an integration.
                          properties:
                            name:
                              maxLength: 63
                              minLength: 1
                              pattern: ^[a-z](?:[a-z0-9-]*[a-z0-9])?$
                              type: string
                            sentryName:
                              maxLength: 100
                              minLength: 1
                              type: string
                          required:
                          - name
                          - sentryName
                          type: object
                        maxItems: 100
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                    type: object
                  slack:
                    description: SlackIntegration declares readable aliases for already-installed
                      workspaces.
                    properties:
                      workspaces:
                        items:
                          description: |-
                            IntegrationCatalogEntry maps one stable local alias to one already-installed Sentry
                            integration name. Declaring an entry never installs an integration.
                          properties:
                            name:
                              maxLength: 63
                              minLength: 1
                              pattern: ^[a-z](?:[a-z0-9-]*[a-z0-9])?$
                              type: string
                            sentryName:
                              maxLength: 100
                              minLength: 1
                              type: string
                          required:
                          - name
                          - sentryName
                          type: object
                        maxItems: 100
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                    type: object
                  telegram:
                    description: TelegramIntegration configures the platform-owned
                      Telegram delivery route.
                    properties:
                      botTokenSecretRef:
                        description: |-
                          SecretKeyReference identifies one key in a Secret from the fixed operator namespace.
                          Namespace is intentionally not user-configurable.
                        properties:
                          key:
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      receiverURL:
                        maxLength: 2048
                        minLength: 9
                        pattern: ^https://[^[:space:]]+$
                        type: string
                      webhookAuthSecretRef:
                        description: |-
                          SecretKeyReference identifies one key in a Secret from the fixed operator namespace.
                          Namespace is intentionally not user-configurable.
                        properties:
                          key:
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    required:
                    - botTokenSecretRef
                    - receiverURL
                    - webhookAuthSecretRef
                    type: object
                type: object
              organization:
                maxLength: 64
                minLength: 1
                type: string
              ownership:
                description: Ownership declares the regional mutation role when regional
                  fencing is enabled.
                properties:
                  region:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z](?:[a-z0-9-]*[a-z0-9])?$
                    type: string
                  revision:
                    format: int64
                    minimum: 1
                    type: integer
                  role:
                    description: ConnectionRole is the platform-controlled regional
                      mutation role.
                    enum:
                    - Active
                    - Standby
                    type: string
                required:
                - region
                - revision
                - role
                type: object
              projectManagement:
                default:
                  unmanagedProjects: Reject
                properties:
                  unmanagedProjects:
                    default: Reject
                    description: UnmanagedProjectPolicy controls existing projects
                      with no recognized ownership marker.
                    enum:
                    - Reject
                    - Standby
                    - Adopt
                    type: string
                type: object
              transport:
                description: |-
                  ConnectionTransport contains explicit development-only transport exceptions. Both
                  options default to false so production connections remain HTTPS with certificate
                  verification enabled.
                properties:
                  allowInsecureHTTP:
                    default: false
                    description: |-
                      AllowInsecureHTTP permits a plain HTTP Sentry origin. This sends the API token
                      without transport encryption and should only be used on a trusted local network.
                    type: boolean
                  insecureSkipTLSVerify:
                    default: false
                    description: |-
                      InsecureSkipTLSVerify keeps HTTPS encryption but disables server certificate and
                      hostname verification. It is mutually exclusive with caBundleSecretRef.
                    type: boolean
                type: object
              url:
                maxLength: 2048
                minLength: 9
                pattern: ^https?://[^[:space:]]+$
                type: string
            required:
            - credentials
            - organization
            - url
            type: object
            x-kubernetes-validations:
            - message: plain HTTP requires transport.allowInsecureHTTP=true
              rule: self.url.startsWith('https://') || (has(self.transport) && self.transport.allowInsecureHTTP)
            - message: transport.insecureSkipTLSVerify requires an HTTPS URL
              rule: '!has(self.transport) || !self.transport.insecureSkipTLSVerify
                || self.url.startsWith(''https://'')'
            - message: transport.insecureSkipTLSVerify and credentials.caBundleSecretRef
                are mutually exclusive
              rule: '!has(self.transport) || !self.transport.insecureSkipTLSVerify
                || !has(self.credentials.caBundleSecretRef)'
            - message: credentials.caBundleSecretRef requires an HTTPS URL
              rule: self.url.startsWith('https://') || !has(self.credentials.caBundleSecretRef)
          status:
            description: status defines the observed state of SentryConnection
            properties:
              capabilities:
                items:
                  maxLength: 64
                  type: string
                maxItems: 100
                type: array
                x-kubernetes-list-type: set
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              effectiveRole:
                enum:
                - Active
                - Standby
                - Fenced
                - Conflict
                type: string
              observedGeneration:
                format: int64
                type: integer
              observedRevision:
                format: int64
                type: integer
              organization:
                maxLength: 64
                type: string
              region:
                maxLength: 63
                type: string
              registrationCommit:
                description: RegistrationCommit is a non-secret, short-lived policy
                  fence written by the system.
                properties:
                  expiresAt:
                    format: date-time
                    type: string
                  operationHash:
                    maxLength: 64
                    minLength: 64
                    pattern: ^[0-9a-f]{64}$
                    type: string
                  policyGeneration:
                    format: int64
                    type: integer
                required:
                - expiresAt
                - operationHash
                - policyGeneration
                type: object
              serverVersion:
                maxLength: 64
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
