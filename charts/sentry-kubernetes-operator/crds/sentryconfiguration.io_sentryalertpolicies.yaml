---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: sentryalertpolicies.sentryconfiguration.io
spec:
  group: sentryconfiguration.io
  names:
    kind: SentryAlertPolicy
    listKind: SentryAlertPolicyList
    plural: sentryalertpolicies
    singular: sentryalertpolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .spec.sentry
      name: Sentry
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SentryAlertPolicySpec is a reusable cluster-scoped alert configuration. Creating a
              policy alone never mutates Sentry; projects opt in by name.
            properties:
              alerts:
                additionalProperties:
                  description: AlertSpec is adapter-neutral and references notification
                    destinations only by local key.
                  properties:
                    actions:
                      items:
                        properties:
                          destination:
                            description: Destination references one flattened notification
                              target such as pagerDuty/on-call.
                            maxLength: 211
                            type: string
                          email:
                            properties:
                              target:
                                description: EmailTarget is restricted to ownership-aware
                                  recipients.
                                enum:
                                - suggested-assignees
                                - team
                                type: string
                              team:
                                maxLength: 63
                                type: string
                            required:
                            - target
                            type: object
                          pagerDutySeverity:
                            description: PagerDutySeverity is explicit so modern and
                              legacy adapters cannot invent different defaults.
                            enum:
                            - default
                            - critical
                            - warning
                            - error
                            - info
                            type: string
                          status:
                            default: triggered
                            description: AlertActionStatus selects the detector state
                              that invokes an action.
                            enum:
                            - triggered
                            - high
                            - medium
                            - resolved
                            type: string
                        type: object
                      maxItems: 20
                      type: array
                      x-kubernetes-list-type: atomic
                    description:
                      maxLength: 1024
                      type: string
                    enabled:
                      default: true
                      type: boolean
                    issue:
                      properties:
                        environment:
                          maxLength: 64
                          type: string
                        filterMatch:
                          default: all
                          description: MatchMode controls boolean composition of typed
                            triggers and filters.
                          enum:
                          - all
                          - any
                          type: string
                        filters:
                          items:
                            properties:
                              key:
                                maxLength: 64
                                type: string
                              operator:
                                description: FilterOperator is shared by bounded numeric
                                  and textual issue filters.
                                enum:
                                - eq
                                - neq
                                - gt
                                - gte
                                - lt
                                - lte
                                - contains
                                type: string
                              type:
                                description: IssueFilterType is deliberately bounded;
                                  raw Sentry condition identifiers are excluded.
                                enum:
                                - age
                                - assignment
                                - category
                                - frequency
                                - priority
                                - type
                                - event-attribute
                                - tag
                                - latest-release
                                - release-age
                                - level
                                type: string
                              value:
                                maxLength: 256
                                type: string
                            required:
                            - operator
                            - type
                            - value
                            type: object
                          maxItems: 16
                          type: array
                          x-kubernetes-list-type: atomic
                        triggerMatch:
                          default: any
                          description: MatchMode controls boolean composition of typed
                            triggers and filters.
                          enum:
                          - all
                          - any
                          type: string
                        triggers:
                          items:
                            properties:
                              threshold:
                                description: Required for event-count, user-count,
                                  and session-percentage.
                                format: int64
                                minimum: 1
                                type: integer
                              type:
                                description: IssueTriggerType selects one issue-state
                                  transition supported by at least one adapter.
                                enum:
                                - first-seen
                                - regression
                                - resolved
                                - escalation
                                - event-count
                                - user-count
                                - session-percentage
                                type: string
                              windowMinutes:
                                description: Required for event-count, user-count,
                                  and session-percentage.
                                format: int32
                                maximum: 10080
                                minimum: 1
                                type: integer
                            required:
                            - type
                            type: object
                          maxItems: 16
                          minItems: 1
                          type: array
                          x-kubernetes-list-map-keys:
                          - type
                          x-kubernetes-list-type: map
                      required:
                      - triggers
                      type: object
                    metric:
                      properties:
                        detection:
                          properties:
                            change:
                              properties:
                                compareMinutes:
                                  format: int32
                                  maximum: 10080
                                  minimum: 1
                                  type: integer
                                direction:
                                  description: ThresholdDirection selects the side
                                    of the boundary that opens an issue.
                                  enum:
                                  - above
                                  - below
                                  type: string
                                highPercent:
                                  format: int64
                                  type: integer
                                mediumPercent:
                                  format: int64
                                  type: integer
                                resolvePercent:
                                  format: int64
                                  type: integer
                              required:
                              - compareMinutes
                              - direction
                              - highPercent
                              type: object
                            dynamic:
                              properties:
                                direction:
                                  description: DynamicDirection controls which anomaly
                                    movement is detected.
                                  enum:
                                  - above
                                  - below
                                  - both
                                  type: string
                                responsiveness:
                                  description: DynamicResponsiveness controls modern
                                    anomaly sensitivity.
                                  enum:
                                  - high
                                  - medium
                                  - low
                                  type: string
                              required:
                              - direction
                              - responsiveness
                              type: object
                            static:
                              properties:
                                direction:
                                  description: ThresholdDirection selects the side
                                    of the boundary that opens an issue.
                                  enum:
                                  - above
                                  - below
                                  type: string
                                high:
                                  format: int64
                                  type: integer
                                medium:
                                  format: int64
                                  type: integer
                                resolve:
                                  format: int64
                                  type: integer
                              required:
                              - direction
                              - high
                              type: object
                          type: object
                        environment:
                          maxLength: 64
                          type: string
                        intervalMinutes:
                          format: int32
                          maximum: 1440
                          minimum: 1
                          type: integer
                        preset:
                          description: MetricPreset selects a known Sentry aggregate
                            without exposing arbitrary query syntax.
                          enum:
                          - error-count
                          - affected-users
                          - crash-free-sessions
                          - crash-free-users
                          - throughput
                          - duration
                          - failure-rate
                          - largest-contentful-paint
                          - logs
                          type: string
                      required:
                      - detection
                      - intervalMinutes
                      - preset
                      type: object
                    notify:
                      items:
                        maxLength: 211
                        minLength: 1
                        pattern: ^(slack|pagerDuty)/[^/[:space:]][^/]*$
                        type: string
                      maxItems: 20
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    ownerTeam:
                      maxLength: 63
                      type: string
                    threshold:
                      format: int64
                      minimum: 1
                      type: integer
                    throttleMinutes:
                      description: Zero means notify on every trigger.
                      format: int32
                      maximum: 43200
                      minimum: 0
                      type: integer
                    trigger:
                      description: |-
                        Trigger, windowMinutes, threshold, and notify are the compact compatibility form.
                        New manifests should select exactly one typed issue or metric block.
                      enum:
                      - first-seen
                      - regression
                      - event-count
                      - user-count
                      type: string
                    windowMinutes:
                      format: int32
                      maximum: 1440
                      minimum: 1
                      type: integer
                  type: object
                maxProperties: 100
                type: object
              notificationTargets:
                description: |-
                  NotificationTargets selects readable resources inside platform-declared integrations.
                  Channel and service names must be unique within their provider because alerts reference
                  them as slack/<channel> and pagerDuty/<service>.
                properties:
                  pagerDuty:
                    additionalProperties:
                      items:
                        type: string
                      type: array
                    description: PagerDuty maps one account catalog name to visible
                      service names.
                    maxProperties: 20
                    type: object
                  slack:
                    additionalProperties:
                      items:
                        type: string
                      type: array
                    description: Slack maps one workspace catalog name to visible
                      channel names.
                    maxProperties: 20
                    type: object
                type: object
              sentry:
                description: Sentry names one cluster-scoped SentryConnection.
                maxLength: 253
                minLength: 1
                type: string
            required:
            - sentry
            type: object
