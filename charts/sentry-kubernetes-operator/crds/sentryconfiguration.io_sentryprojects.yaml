---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: sentryprojects.sentryconfiguration.io
spec:
  group: sentryconfiguration.io
  names:
    kind: SentryProject
    listKind: SentryProjectList
    plural: sentryprojects
    singular: sentryproject
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.origin
      name: Origin
      type: string
    - jsonPath: .status.accessMode
      name: Mode
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SentryProject is the Schema for the sentryprojects API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of SentryProject
            properties:
              alerts:
                additionalProperties:
                  description: AlertSpec is adapter-neutral and references notification
                    destinations only by local key.
                  properties:
                    enabled:
                      default: true
                      type: boolean
                    notify:
                      items:
                        maxLength: 63
                        minLength: 1
                        type: string
                      maxItems: 20
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    threshold:
                      format: int64
                      minimum: 1
                      type: integer
                    trigger:
                      description: AlertTrigger is the portable alert condition exposed
                        by the operator.
                      enum:
                      - first-seen
                      - regression
                      - event-count
                      type: string
                    windowMinutes:
                      format: int32
                      maximum: 1440
                      minimum: 1
                      type: integer
                  required:
                  - notify
                  - trigger
                  type: object
                  x-kubernetes-validations:
                  - message: event-count requires windowMinutes and threshold; issue
                      triggers forbid them
                    rule: 'self.trigger == ''event-count'' ? (has(self.windowMinutes)
                      && has(self.threshold)) : (!has(self.windowMinutes) && !has(self.threshold))'
                description: |-
                  An absent alerts field leaves existing alert children unmanaged. An explicit empty map
                  deletes all protected operator-owned alerts.
                maxProperties: 100
                type: object
              connection:
                maxLength: 253
                minLength: 1
                type: string
              destinations:
                additionalProperties:
                  description: DestinationSpec contains exactly one adapter-neutral
                    destination selector.
                  properties:
                    pagerDuty:
                      description: PagerDutyDestination selects a PagerDuty service
                        by readable names.
                      properties:
                        account:
                          maxLength: 100
                          type: string
                        service:
                          maxLength: 100
                          minLength: 1
                          type: string
                      required:
                      - service
                      type: object
                    slack:
                      description: SlackDestination selects a Slack channel by readable
                        names.
                      properties:
                        channel:
                          maxLength: 100
                          minLength: 1
                          type: string
                        workspace:
                          maxLength: 100
                          type: string
                      required:
                      - channel
                      type: object
                    telegram:
                      description: TelegramDestination selects a logical Telegram
                        target; numeric IDs stay internal.
                      properties:
                        target:
                          maxLength: 100
                          minLength: 1
                          type: string
                      required:
                      - target
                      type: object
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one destination type is required
                    rule: (has(self.slack) && !has(self.pagerDuty) && !has(self.telegram))
                      || (!has(self.slack) && has(self.pagerDuty) && !has(self.telegram))
                      || (!has(self.slack) && !has(self.pagerDuty) && has(self.telegram))
                maxProperties: 20
                type: object
              dsn:
                description: DSNSpec customizes the public DSN output without exposing
                  external IDs.
                properties:
                  clientKey:
                    maxLength: 100
                    minLength: 1
                    type: string
                  secret:
                    maxLength: 253
                    minLength: 1
                    type: string
                type: object
              lifecycle:
                default: {}
                description: LifecycleSpec defines deletion behavior.
                properties:
                  onDelete:
                    default: Retain
                    description: OnDeletePolicy controls whether the external project
                      may be deleted with the CR.
                    enum:
                    - Retain
                    - DeleteProject
                    type: string
                type: object
              paused:
                default: false
                type: boolean
              project:
                description: ProjectSelector chooses either a new managed project
                  or an existing read-only project.
                properties:
                  create:
                    description: ProjectCreate identifies a new project entirely through
                      readable values.
                    properties:
                      displayName:
                        maxLength: 50
                        minLength: 1
                        type: string
                      platform:
                        maxLength: 64
                        minLength: 1
                        type: string
                      slug:
                        maxLength: 64
                        minLength: 1
                        type: string
                      team:
                        maxLength: 64
                        minLength: 1
                        type: string
                    required:
                    - team
                    type: object
                  use:
                    maxLength: 64
                    minLength: 1
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of project.create or project.use is required
                  rule: has(self.create) != has(self.use)
              settings:
                description: ProjectSettings is deliberately limited to the T00 source-confirmed
                  alpha surface.
                properties:
                  filters:
                    description: FilterSettings contains the source-confirmed inbound
                      filters.
                    properties:
                      browserExtensions:
                        type: boolean
                      localhost:
                        type: boolean
                      webCrawlers:
                        type: boolean
                    type: object
                  pii:
                    description: PIISettings contains the source-confirmed, adapter-neutral
                      data scrubbing fields.
                    properties:
                      safeFields:
                        items:
                          maxLength: 128
                          type: string
                        maxItems: 64
                        type: array
                      scrubData:
                        type: boolean
                      scrubDefaults:
                        type: boolean
                      scrubIPAddresses:
                        type: boolean
                      sensitiveFields:
                        items:
                          maxLength: 128
                          type: string
                        maxItems: 64
                        type: array
                    type: object
                type: object
            required:
            - project
            type: object
            x-kubernetes-validations:
            - message: project.use forbids settings, destinations and alerts
              rule: '!has(self.project.use) || (!has(self.settings) && !has(self.destinations)
                && !has(self.alerts))'
            - message: project.use forbids lifecycle.onDelete DeleteProject
              rule: '!has(self.project.use) || self.lifecycle.onDelete != ''DeleteProject'''
            - message: destination names must be lowercase DNS labels
              rule: '!has(self.destinations) || self.destinations.all(k, k.matches(''^[a-z](?:[a-z0-9-]*[a-z0-9])?$''))'
            - message: alert names must be lowercase DNS labels
              rule: '!has(self.alerts) || self.alerts.all(k, k.matches(''^[a-z](?:[a-z0-9-]*[a-z0-9])?$''))'
          status:
            description: status defines the observed state of SentryProject
            properties:
              accessMode:
                enum:
                - Manage
                - ReadOnly
                - Deny
                type: string
              alerts:
                additionalProperties:
                  description: AlertStatus is the safe status of one local alert key.
                  properties:
                    reason:
                      maxLength: 64
                      type: string
                    state:
                      maxLength: 64
                      type: string
                  required:
                  - reason
                  - state
                  type: object
                description: |-
                  Alerts exposes only local names and safe lifecycle state. Adapter and external IDs stay
                  in the protected project binding.
                type: object
                x-kubernetes-map-type: granular
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              destinations:
                additionalProperties:
                  description: DestinationStatus is the safe status for one spec.destinations
                    local key.
                  properties:
                    reason:
                      maxLength: 64
                      type: string
                    registrationCommit:
                      description: |-
                        RegistrationCommit is a short-lived, non-secret fence used by the
                        authenticated Telegram registration writer.
                      properties:
                        expiresAt:
                          format: date-time
                          type: string
                        operationHash:
                          maxLength: 64
                          minLength: 64
                          pattern: ^[0-9a-f]{64}$
                          type: string
                        policyGeneration:
                          format: int64
                          type: integer
                      required:
                      - expiresAt
                      - operationHash
                      - policyGeneration
                      type: object
                    state:
                      maxLength: 64
                      type: string
                    type:
                      enum:
                      - slack
                      - pagerduty
                      - telegram
                      type: string
                  required:
                  - reason
                  - state
                  - type
                  type: object
                description: |-
                  Destinations exposes only local names and safe lifecycle state. External
                  integration, channel, service and Telegram identities remain protected.
                type: object
                x-kubernetes-map-type: granular
              dsnClientKey:
                description: |-
                  DSNClientKey is the current readable Sentry client-key name or label. The
                  protected binding, not this display value, pins the external identity.
                maxLength: 253
                type: string
              dsnSecret:
                maxLength: 253
                type: string
              observedGeneration:
                format: int64
                type: integer
              origin:
                enum:
                - Managed
                - External
                type: string
              projectURL:
                maxLength: 2048
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
