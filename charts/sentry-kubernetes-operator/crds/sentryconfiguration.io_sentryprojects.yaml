---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: sentryprojects.sentryconfiguration.io
spec:
  group: sentryconfiguration.io
  names:
    kind: SentryProject
    listKind: SentryProjectList
    plural: sentryprojects
    singular: sentryproject
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.origin
      name: Origin
      type: string
    - jsonPath: .status.accessMode
      name: Mode
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SentryProject is the Schema for the sentryprojects API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of SentryProject
            properties:
              alertPolicies:
                description: |-
                  AlertPolicies applies reusable policies in declared order. It is mutually exclusive
                  with the backward-compatible alertPolicy field. Conflicting keys fail closed.
                items:
                  maxLength: 253
                  minLength: 1
                  type: string
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
              alertPolicy:
                maxLength: 253
                minLength: 1
                type: string
              alerts:
                additionalProperties:
                  description: AlertSpec is adapter-neutral and references notification
                    destinations only by local key.
                  properties:
                    actions:
                      items:
                        properties:
                          destination:
                            description: Destination references one flattened notification
                              target such as pagerDuty/on-call.
                            maxLength: 211
                            type: string
                          email:
                            properties:
                              target:
                                description: EmailTarget is restricted to ownership-aware
                                  recipients.
                                enum:
                                - suggested-assignees
                                - team
                                type: string
                              team:
                                maxLength: 63
                                type: string
                            required:
                            - target
                            type: object
                          githubIssue:
                            description: |-
                              GitHubIssue creates a ticket through one connection-owned source-code integration.
                              It is supported only by modern issue workflows.
                            properties:
                              assignee:
                                maxLength: 100
                                type: string
                              integration:
                                maxLength: 63
                                minLength: 1
                                type: string
                              labels:
                                items:
                                  maxLength: 100
                                  minLength: 1
                                  type: string
                                maxItems: 20
                                type: array
                              repository:
                                maxLength: 63
                                minLength: 1
                                type: string
                            required:
                            - integration
                            - repository
                            type: object
                          pagerDutySeverity:
                            description: PagerDutySeverity is explicit so modern and
                              legacy adapters cannot invent different defaults.
                            enum:
                            - default
                            - critical
                            - warning
                            - error
                            - info
                            type: string
                          status:
                            default: triggered
                            description: AlertActionStatus selects the detector state
                              that invokes an action.
                            enum:
                            - triggered
                            - high
                            - medium
                            - resolved
                            type: string
                        type: object
                      maxItems: 20
                      type: array
                      x-kubernetes-list-type: atomic
                    description:
                      maxLength: 1024
                      type: string
                    enabled:
                      default: true
                      type: boolean
                    issue:
                      properties:
                        environment:
                          maxLength: 64
                          type: string
                        filterMatch:
                          default: all
                          description: MatchMode controls boolean composition of typed
                            triggers and filters.
                          enum:
                          - all
                          - any
                          type: string
                        filters:
                          items:
                            properties:
                              key:
                                maxLength: 64
                                type: string
                              operator:
                                description: FilterOperator is shared by bounded numeric
                                  and textual issue filters.
                                enum:
                                - eq
                                - neq
                                - gt
                                - gte
                                - lt
                                - lte
                                - contains
                                type: string
                              type:
                                description: IssueFilterType is deliberately bounded;
                                  raw Sentry condition identifiers are excluded.
                                enum:
                                - age
                                - assignment
                                - category
                                - frequency
                                - priority
                                - type
                                - event-attribute
                                - tag
                                - latest-release
                                - release-age
                                - level
                                type: string
                              value:
                                maxLength: 256
                                type: string
                            required:
                            - operator
                            - type
                            - value
                            type: object
                          maxItems: 16
                          type: array
                          x-kubernetes-list-type: atomic
                        triggerMatch:
                          default: any
                          description: MatchMode controls boolean composition of typed
                            triggers and filters.
                          enum:
                          - all
                          - any
                          type: string
                        triggers:
                          items:
                            properties:
                              threshold:
                                description: Required for event-count, user-count,
                                  and session-percentage.
                                format: int64
                                minimum: 1
                                type: integer
                              type:
                                description: IssueTriggerType selects one issue-state
                                  transition supported by at least one adapter.
                                enum:
                                - first-seen
                                - regression
                                - resolved
                                - escalation
                                - event-count
                                - user-count
                                - session-percentage
                                type: string
                              windowMinutes:
                                description: Required for event-count, user-count,
                                  and session-percentage.
                                format: int32
                                maximum: 10080
                                minimum: 1
                                type: integer
                            required:
                            - type
                            type: object
                          maxItems: 16
                          minItems: 1
                          type: array
                          x-kubernetes-list-map-keys:
                          - type
                          x-kubernetes-list-type: map
                      required:
                      - triggers
                      type: object
                    metric:
                      properties:
                        applicationMetric:
                          description: ApplicationMetric is required only for the
                            application-metric preset.
                          properties:
                            left:
                              description: |-
                                ApplicationMetricTerm selects one exact catalog metric. Names and units deliberately use a
                                restricted portable alphabet so the adapter never accepts raw query or aggregate syntax.
                              properties:
                                aggregation:
                                  description: |-
                                    ApplicationMetricAggregation is the bounded set exposed by Sentry's metric detector UI.
                                    Compatibility validation further restricts it by metric type.
                                  enum:
                                  - count
                                  - sum
                                  - avg
                                  - min
                                  - max
                                  - p50
                                  - p75
                                  - p90
                                  - p95
                                  - p99
                                  - per-second
                                  - per-minute
                                  type: string
                                name:
                                  maxLength: 128
                                  minLength: 1
                                  pattern: ^[A-Za-z][A-Za-z0-9_.:/-]*$
                                  type: string
                                type:
                                  description: ApplicationMetricType is the OpenTelemetry
                                    metric kind stored by Sentry.
                                  enum:
                                  - counter
                                  - gauge
                                  - distribution
                                  type: string
                                unit:
                                  description: Unit is omitted for unitless metrics.
                                  maxLength: 32
                                  pattern: ^[A-Za-z0-9_.:/-]*$
                                  type: string
                              required:
                              - aggregation
                              - name
                              - type
                              type: object
                            operator:
                              description: ApplicationMetricOperator combines exactly
                                two bounded metric terms.
                              enum:
                              - add
                              - subtract
                              - multiply
                              - divide
                              type: string
                            right:
                              description: |-
                                ApplicationMetricTerm selects one exact catalog metric. Names and units deliberately use a
                                restricted portable alphabet so the adapter never accepts raw query or aggregate syntax.
                              properties:
                                aggregation:
                                  description: |-
                                    ApplicationMetricAggregation is the bounded set exposed by Sentry's metric detector UI.
                                    Compatibility validation further restricts it by metric type.
                                  enum:
                                  - count
                                  - sum
                                  - avg
                                  - min
                                  - max
                                  - p50
                                  - p75
                                  - p90
                                  - p95
                                  - p99
                                  - per-second
                                  - per-minute
                                  type: string
                                name:
                                  maxLength: 128
                                  minLength: 1
                                  pattern: ^[A-Za-z][A-Za-z0-9_.:/-]*$
                                  type: string
                                type:
                                  description: ApplicationMetricType is the OpenTelemetry
                                    metric kind stored by Sentry.
                                  enum:
                                  - counter
                                  - gauge
                                  - distribution
                                  type: string
                                unit:
                                  description: Unit is omitted for unitless metrics.
                                  maxLength: 32
                                  pattern: ^[A-Za-z0-9_.:/-]*$
                                  type: string
                              required:
                              - aggregation
                              - name
                              - type
                              type: object
                          required:
                          - left
                          type: object
                        detection:
                          properties:
                            change:
                              properties:
                                compareMinutes:
                                  format: int32
                                  maximum: 10080
                                  minimum: 1
                                  type: integer
                                direction:
                                  description: ThresholdDirection selects the side
                                    of the boundary that opens an issue.
                                  enum:
                                  - above
                                  - below
                                  type: string
                                highPercent:
                                  format: int64
                                  type: integer
                                mediumPercent:
                                  format: int64
                                  type: integer
                                resolvePercent:
                                  format: int64
                                  type: integer
                              required:
                              - compareMinutes
                              - direction
                              - highPercent
                              type: object
                            dynamic:
                              properties:
                                direction:
                                  description: DynamicDirection controls which anomaly
                                    movement is detected.
                                  enum:
                                  - above
                                  - below
                                  - both
                                  type: string
                                responsiveness:
                                  description: DynamicResponsiveness controls modern
                                    anomaly sensitivity.
                                  enum:
                                  - high
                                  - medium
                                  - low
                                  type: string
                              required:
                              - direction
                              - responsiveness
                              type: object
                            static:
                              properties:
                                direction:
                                  description: ThresholdDirection selects the side
                                    of the boundary that opens an issue.
                                  enum:
                                  - above
                                  - below
                                  type: string
                                high:
                                  format: int64
                                  type: integer
                                medium:
                                  format: int64
                                  type: integer
                                resolve:
                                  format: int64
                                  type: integer
                              required:
                              - direction
                              - high
                              type: object
                          type: object
                        environment:
                          maxLength: 64
                          type: string
                        intervalMinutes:
                          format: int32
                          maximum: 1440
                          minimum: 1
                          type: integer
                        preset:
                          description: MetricPreset selects a known Sentry aggregate
                            without exposing arbitrary query syntax.
                          enum:
                          - error-count
                          - affected-users
                          - crash-free-sessions
                          - crash-free-users
                          - throughput
                          - duration
                          - failure-rate
                          - largest-contentful-paint
                          - logs
                          - application-metric
                          type: string
                      required:
                      - detection
                      - intervalMinutes
                      - preset
                      type: object
                    notify:
                      items:
                        maxLength: 211
                        minLength: 1
                        pattern: ^(slack|pagerDuty)/[^/[:space:]][^/]*$
                        type: string
                      maxItems: 20
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    ownerTeam:
                      maxLength: 63
                      type: string
                    threshold:
                      format: int64
                      minimum: 1
                      type: integer
                    throttleMinutes:
                      description: Zero means notify on every trigger.
                      format: int32
                      maximum: 43200
                      minimum: 0
                      type: integer
                    trigger:
                      description: |-
                        Trigger, windowMinutes, threshold, and notify are the compact compatibility form.
                        New manifests should select exactly one typed issue or metric block.
                      enum:
                      - first-seen
                      - regression
                      - event-count
                      - user-count
                      type: string
                    windowMinutes:
                      format: int32
                      maximum: 1440
                      minimum: 1
                      type: integer
                  type: object
                description: |-
                  An absent alerts field leaves existing alert children unmanaged. An explicit empty map
                  deletes all protected operator-owned alerts.
                maxProperties: 100
                type: object
              clientKeys:
                additionalProperties:
                  description: |-
                    ManagedClientKeySpec owns one Sentry project client key without accepting public or
                    secret key material. Increasing rotationRevision creates a server-generated replacement.
                  properties:
                    active:
                      default: true
                      type: boolean
                    loader:
                      description: |-
                        ClientKeyLoaderSpec owns the bounded JavaScript loader switches associated with a
                        managed client key. DSNs and OTLP endpoints are derived outputs, not desired state.
                      properties:
                        debug:
                          type: boolean
                        logsAndMetrics:
                          type: boolean
                        replay:
                          type: boolean
                        tracing:
                          type: boolean
                        userFeedback:
                          type: boolean
                      type: object
                    publishDSN:
                      description: |-
                        PublishDSN selects this key as the single public DSN source for the project.
                        At most one managed key may enable publication.
                      type: boolean
                    rateLimit:
                      description: |-
                        ClientKeyRateLimit caps accepted errors for one managed client key. A missing rateLimit
                        explicitly disables the per-key limit because the complete managed child is owned.
                      properties:
                        count:
                          format: int64
                          maximum: 2147483647
                          minimum: 1
                          type: integer
                        windowSeconds:
                          description: |-
                            WindowSeconds is bounded by the portable limit shared by both supported Sentry
                            versions.
                          format: int32
                          maximum: 86400
                          minimum: 1
                          type: integer
                      required:
                      - count
                      - windowSeconds
                      type: object
                    rotationRevision:
                      default: 1
                      format: int64
                      maximum: 2147483647
                      minimum: 1
                      type: integer
                  type: object
                description: |-
                  ClientKeys owns bounded server-generated client-key children. An absent field leaves
                  all client keys unmanaged; an explicit empty map removes protected operator-owned keys.
                maxProperties: 20
                type: object
              codeMappings:
                additionalProperties:
                  description: |-
                    CodeMappingSpec maps stack-trace paths to one connection-owned repository alias. Sentry,
                    integration, repository, and mapping identities never enter the public resource.
                  properties:
                    defaultBranch:
                      maxLength: 255
                      type: string
                    importCodeowners:
                      description: |-
                        ImportCodeowners fetches the repository CODEOWNERS file through Sentry and owns the
                        corresponding Sentry ProjectCodeOwners child for this mapping.
                      type: boolean
                    integration:
                      description: Integration selects a sourceCode installation alias
                        on the SentryConnection.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z](?:[a-z0-9-]*[a-z0-9])?$
                      type: string
                    repository:
                      description: Repository selects a repository alias nested under
                        the integration.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z](?:[a-z0-9-]*[a-z0-9])?$
                      type: string
                    sourceRoot:
                      maxLength: 512
                      type: string
                    stackRoot:
                      maxLength: 512
                      type: string
                  required:
                  - integration
                  - repository
                  type: object
                description: |-
                  CodeMappings owns repository path mappings keyed by stable local aliases. An absent
                  field leaves mappings unmanaged; an explicit empty map removes owned mappings and their
                  imported CODEOWNERS children.
                maxProperties: 50
                type: object
              displayName:
                description: |-
                  DisplayName is the optional human-facing Sentry project name. The Kubernetes name
                  remains the stable project slug and ownership key.
                maxLength: 64
                type: string
              existingClientKey:
                description: |-
                  ExistingClientKey selects an externally managed key only for public DSN publication.
                  It is mutually exclusive with publishDSN on an operator-managed client key.
                properties:
                  name:
                    description: Name is the exact readable Sentry client-key name.
                    maxLength: 100
                    minLength: 1
                    type: string
                  publishDSN:
                    default: true
                    description: |-
                      PublishDSN publishes the selected public DSN to the namespace-local sentry-dsns
                      Secret. It must be true when this block is present.
                    type: boolean
                required:
                - name
                type: object
              grantAccess:
                description: |-
                  GrantAccess manages additional team access for a managed project. Kubernetes RBAC on the
                  namespaced SentryProject is the authorization boundary for selecting team slugs.
                properties:
                  teams:
                    items:
                      maxLength: 64
                      minLength: 1
                      pattern: ^[a-z](?:[a-z0-9-]*[a-z0-9])?$
                      type: string
                    maxItems: 50
                    type: array
                    x-kubernetes-list-type: set
                type: object
              issueOwnership:
                description: |-
                  IssueOwnership manages team-only issue ownership rules and assignment behavior.
                  Every referenced team must be the primary project team or appear in grantAccess.
                properties:
                  autoAssignment:
                    description: IssueOwnershipAutoAssignment controls automatic issue
                      assignment.
                    enum:
                    - IssueOwner
                    - SuspectCommits
                    - Disabled
                    type: string
                  codeownersAutoSync:
                    description: |-
                      CodeownersAutoSync controls synchronization of already imported CODEOWNERS data. It
                      does not import a repository or create code mappings.
                    type: boolean
                  fallthrough:
                    description: IssueOwnershipFallthrough controls unmatched issues.
                    enum:
                    - AllMembers
                    - NoOne
                    type: string
                  rules:
                    description: Rules are evaluated in order. An explicit empty list
                      clears custom ownership rules.
                    items:
                      description: |-
                        IssueOwnershipRule maps one ordered matcher to readable Sentry team slugs. Direct users,
                        email addresses, and raw external identities are deliberately excluded.
                      properties:
                        matcher:
                          description: |-
                            IssueOwnershipMatcher is a bounded, structured ownership-rule matcher. Whitespace,
                            comments, quoted identifiers, and raw Sentry grammar stay outside the alpha API.
                          properties:
                            pattern:
                              maxLength: 256
                              minLength: 1
                              pattern: ^[^[:space:]#\"]+$
                              type: string
                            tagKey:
                              description: TagKey is the event tag name without Sentry's
                                tags. prefix.
                              maxLength: 64
                              minLength: 1
                              pattern: ^[A-Za-z0-9_.-]+$
                              type: string
                            type:
                              description: IssueOwnershipMatcherType selects one portable
                                Sentry ownership-rule matcher.
                              enum:
                              - path
                              - module
                              - url
                              - tag
                              type: string
                          required:
                          - pattern
                          - type
                          type: object
                        teams:
                          items:
                            maxLength: 63
                            minLength: 1
                            pattern: ^[a-z](?:[a-z0-9-]*[a-z0-9])?$
                            type: string
                          maxItems: 10
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: set
                      required:
                      - matcher
                      - teams
                      type: object
                    maxItems: 100
                    type: array
                required:
                - autoAssignment
                - codeownersAutoSync
                - fallthrough
                type: object
              lifecycle:
                default: {}
                description: LifecycleSpec defines deletion behavior.
                properties:
                  onDelete:
                    default: Retain
                    description: OnDeletePolicy controls whether the external project
                      may be deleted with the CR.
                    enum:
                    - Retain
                    - DeleteProject
                    type: string
                type: object
              notificationTargets:
                description: |-
                  NotificationTargets selects readable resources inside platform-declared integrations.
                  Channel and service names must be unique within their provider because alerts reference
                  them as slack/<channel> and pagerDuty/<service>.
                properties:
                  pagerDuty:
                    additionalProperties:
                      items:
                        type: string
                      type: array
                    description: PagerDuty maps one account catalog name to visible
                      service names.
                    maxProperties: 20
                    type: object
                  slack:
                    additionalProperties:
                      items:
                        type: string
                      type: array
                    description: Slack maps one workspace catalog name to visible
                      channel names.
                    maxProperties: 20
                    type: object
                type: object
              paused:
                default: false
                type: boolean
              platform:
                description: Platform is an optional Sentry SDK platform hint supplied
                  when the project is created.
                maxLength: 64
                minLength: 1
                type: string
              sentry:
                maxLength: 253
                minLength: 1
                type: string
              settings:
                description: ProjectSettings is deliberately limited to the T00 source-confirmed
                  alpha surface.
                properties:
                  behavior:
                    description: |-
                      BehaviorSettings contains bounded project behavior shared by both supported Sentry
                      compatibility versions.
                    properties:
                      allowedDomains:
                        description: |-
                          AllowedDomains owns the non-empty set of browser origins allowed to submit events.
                          Each entry is one DNS hostname or HTTP(S) origin with an optional leading wildcard
                          subdomain and fixed numeric port. A sole `*` entry allows every origin.
                        items:
                          maxLength: 253
                          pattern: ^(\*|((https?://)?(\*\.)?[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?)(:[0-9]{1,5})?)$
                          type: string
                        maxItems: 100
                        minItems: 1
                        type: array
                        x-kubernetes-list-type: set
                      autoResolveHours:
                        description: |-
                          AutoResolveHours automatically resolves an issue after this many unseen hours. Zero
                          disables automatic resolution.
                        format: int64
                        maximum: 2147483647
                        minimum: 0
                        type: integer
                      crashReportLimit:
                        description: |-
                          CrashReportLimit controls stored native crash-report attachments per issue. Minus one
                          is unlimited, zero disables storage, and positive values set an explicit limit.
                        format: int32
                        maximum: 100
                        minimum: -1
                        type: integer
                      defaultEnvironment:
                        description: |-
                          DefaultEnvironment selects the environment shown by default. An empty value clears the
                          selection without deleting any Sentry environment.
                        maxLength: 64
                        pattern: ^[^\n\r\f/]*$
                        type: string
                      releaseAutoCreation:
                        type: boolean
                      scrapeJavaScript:
                        description: ScrapeJavaScript permits Sentry to fetch JavaScript
                          source files and source maps.
                        type: boolean
                    type: object
                  filters:
                    description: |-
                      FilterSettings contains the source-confirmed inbound filters. A nil field is unmanaged;
                      an explicitly empty legacyBrowsers set disables every managed browser subfilter.
                    properties:
                      applicationMetrics:
                        items:
                          maxLength: 200
                          type: string
                        maxItems: 100
                        type: array
                        x-kubernetes-list-type: set
                      browserExtensions:
                        type: boolean
                      chunkLoadErrors:
                        type: boolean
                      errorMessages:
                        items:
                          maxLength: 200
                          type: string
                        maxItems: 100
                        type: array
                        x-kubernetes-list-type: set
                      filteredTransactions:
                        type: boolean
                      hydrationErrors:
                        type: boolean
                      ipAddresses:
                        items:
                          maxLength: 128
                          type: string
                        maxItems: 100
                        type: array
                        x-kubernetes-list-type: set
                      legacyBrowsers:
                        items:
                          description: LegacyBrowserFilter selects one standard Sentry
                            legacy-browser family.
                          enum:
                          - ie
                          - edge
                          - safari
                          - firefox
                          - chrome
                          - opera
                          - android
                          - opera_mini
                          type: string
                        maxItems: 8
                        type: array
                        x-kubernetes-list-type: set
                      localhost:
                        type: boolean
                      logMessages:
                        description: |-
                          Modern-only filters. Compatibility validation rejects them before external I/O on
                          legacy connections.
                        items:
                          maxLength: 200
                          type: string
                        maxItems: 100
                        type: array
                        x-kubernetes-list-type: set
                      releases:
                        items:
                          maxLength: 200
                          type: string
                        maxItems: 100
                        type: array
                        x-kubernetes-list-type: set
                      webCrawlers:
                        type: boolean
                    type: object
                  grouping:
                    description: |-
                      GroupingSettings owns the portable ordered grouping enhancement and fingerprinting rule
                      lists. Explicit empty lists clear the respective rule text.
                    properties:
                      enhancements:
                        items:
                          description: GroupingEnhancementRule is serialized into
                            one canonical Sentry stack-trace rule.
                          properties:
                            action:
                              description: |-
                                GroupingEnhancementAction selects one portable frame classification or contribution
                                action.
                              enum:
                              - MarkInApp
                              - MarkOutOfApp
                              - Include
                              - Exclude
                              type: string
                            matcher:
                              description: GroupingEnhancementMatcher selects one
                                portable stack-frame field.
                              enum:
                              - path
                              - module
                              - function
                              - package
                              type: string
                            negate:
                              type: boolean
                            pattern:
                              maxLength: 256
                              minLength: 1
                              pattern: ^[^\n\r\f\"]+$
                              type: string
                          required:
                          - action
                          - matcher
                          - pattern
                          type: object
                        maxItems: 100
                        type: array
                      fingerprints:
                        items:
                          description: FingerprintRule is serialized into one canonical
                            ordered Sentry fingerprinting rule.
                          properties:
                            includeDefault:
                              description: IncludeDefault appends Sentry's original
                                fingerprint to the custom values.
                              type: boolean
