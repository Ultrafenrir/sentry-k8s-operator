image:
  repository: ultrafenrir/sentry-k8s-operator
  tag: dev
  pullPolicy: IfNotPresent

# The chart always creates this cluster-scoped connection. Create the referenced Secret
# in sentry-kubernetes-operator-system before or immediately after installing the chart.
sentryConnection:
  name: default
  spec:
    url: https://sentry.example.com
    organization: example
    credentials:
      tokenSecretRef:
        name: sentry-api-token
        key: token
    projectManagement:
      unmanagedProjects: Reject
    access: []

controllerMonitoring:
  # Requires Prometheus Operator CRDs. Metrics are served over plain HTTP.
  enabled: false
