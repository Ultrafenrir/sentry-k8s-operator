image:
  repository: ultrafenrir/sentry-k8s-operator
  tag: v0.2.0-alpha.1
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

# The chart always creates this cluster-scoped connection. Create the referenced Secret
# in the Helm release namespace before or immediately after installing the chart.
sentryConnection:
  # Empty means the Helm release name.
  name: ""
  spec:
    url: https://sentry.example.com
    organization: example
    credentials:
      tokenSecretRef:
        name: sentry-api-token
        key: token
    projectManagement:
      unmanagedProjects: Reject
    access: []

controllerMonitoring:
  # Requires Prometheus Operator CRDs. Metrics are served over plain HTTP.
  enabled: false
